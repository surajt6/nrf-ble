[package]
name = "{{project-name}}"
version = "0.1.0"
edition = "2024"
authors = ["{{authors}}"]

[dependencies]
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-nrf = { version = "0.11", features = ["defmt", "nrf54l15-app-s", "time-driver-grtc"{% if xiao_rf_switch %}, "unstable-pac"{% endif %}] }
embassy-time = { version = "0.5.1" }
embassy-futures = "0.1.1"
defmt = "1"
log = "0.4"
defmt-rtt = "1"
panic-probe = { version = "1", features = ["print-defmt"] }
cortex-m = "0.7.6"
cortex-m-rt = "0.7.5"
static_cell = "2"
# nrf-mpsl provides the critical section: it keeps the MPSL radio, timer, and RTC
# interrupts enabled. Do not enable cortex-m's critical-section-single-core.
nrf-mpsl = { version = "0.4", features = ["defmt", "critical-section-impl"] }
nrf-sdc = { version = "0.4", features = ["defmt", "peripheral", "central", "nrf54l15-app-s"] }
bt-hci = { version = "0.10", features = ["defmt"] }
heapless = "0.9.3"
trouble-host = { version = "0.8", features = ["scan", "defmt", "security"] }

[profile.release]
debug = 2

[[bin]]
name = "{{project-name}}"
test = false
bench = false

[package]
name = "{{project-name}}"
version = "0.1.0"
edition = "2024"
authors = ["{{authors}}"]

[features]
default = []

[dependencies]
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-nrf = { version = "0.11", features = ["defmt", "nrf52840", "time-driver-rtc1"] }
embassy-time = { version = "0.5.1" }
embassy-futures = "0.1.1"
defmt = "1"
log = "0.4"
defmt-rtt = "1"
panic-probe = { version = "1", features = ["print-defmt"] }
cortex-m = { version = "0.7.6", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"
static_cell = "2"
nrf-sdc = { version = "0.4", features = ["defmt", "peripheral", "central", "nrf52840"] }
bt-hci = { version = "0.10", features = ["defmt"] }
heapless = "0.9.3"
trouble-host = { version = "0.8", features = ["scan", "defmt", "security", "peripheral", "serde", "connection-metrics"] }
rand_chacha = { version = "0.3", default-features = false}
embassy-crypto = { git = "https://github.com/embassy-rs/embassy.git", rev = "bd35bd7a7d19147c8bcae9c2eda99b25e597294c" }
embassy-sync = { version = "0.8", features = ["defmt"] }
sequential-storage = { version = "7.2.0", default-features = false, features = ["postcard"]}
serde = { version = "1.0", default-features = false, features = ["derive"] }
embedded-storage-async = "0.4.2"

[profile.release]
debug = 2

[[bin]]
name = "{{project-name}}"
test = false
bench = false
